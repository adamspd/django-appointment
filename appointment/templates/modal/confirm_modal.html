{% load i18n %}
<!-- Generic Confirmation Modal (every use confirms a deletion or a removal) -->
{% csrf_token %}
<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">Modal title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"
                        onclick="closeConfirmModal()"></button>
            </div>
            <div class="modal-body" id="modalBody">
                Modal body text goes here.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn djappt-btn djappt-btn-ghost btn-secondary" data-bs-dismiss="modal"
                        onclick="closeConfirmModal()">{% trans 'Close' %}</button>
                <a href="#" class="btn djappt-btn djappt-btn-danger btn-primary" id="modalActionBtn">{% trans 'Action' %}</a>
            </div>
        </div>
    </div>
</div>
